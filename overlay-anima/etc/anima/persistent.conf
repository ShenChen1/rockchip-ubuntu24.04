# Read from the read-only system slot. Exactly eight fields per entry.
# type stage init access target source mode owner
# init: empty or seed (bind only). Metadata applies only to new directories.
# machine-id and random-seed are managed internally, outside this directory list.
overlay init empty rw /etc/NetworkManager/system-connections /overlay/.anima-persistent/overlays/etc/NetworkManager/system-connections 0700 0:0
overlay init empty rw /etc/netplan /overlay/.anima-persistent/overlays/etc/netplan 0700 0:0
overlay init empty rw /etc/ssh /overlay/.anima-persistent/overlays/etc/ssh - -
overlay init empty rw /home /overlay/.anima-persistent/overlays/home - -
bind init seed rw /var/lib/NetworkManager /overlay/.anima-persistent/state/var/lib/NetworkManager - -
bind init seed rw /var/lib/bluetooth /overlay/.anima-persistent/state/var/lib/bluetooth - -
bind init seed rw /var/lib/alsa /overlay/.anima-persistent/state/var/lib/alsa - -
bind init seed rw /var/lib/ntpsec /overlay/.anima-persistent/state/var/lib/ntpsec - -
# Final runtime permissions, ownership, and ACLs are managed by systemd-tmpfiles.
bind systemd empty rw /var/log/journal /overlay/.anima-journal - -
bind systemd empty rw /var/lib/systemd/pstore /overlay/.anima-pstore - -
